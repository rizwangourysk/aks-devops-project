---
trigger:
  - main
variables:
  dockerRegistryServiceConnection: acr-connection-fixed
  azureSubscription: azure-subscription-fixed
  imageRepository: aks-devops-app
  containerRegistry: pavandevopsacr12345.azurecr.io
  dockerfilePath: Dockerfile
  tag: $(Build.BuildId)
  aksResourceGroup: aks-devops-rg2
  aksClusterName: pavan-aks-cluster
stages:
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: Docker@2
            displayName: Build and Push Docker Image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
  - stage: SecurityScan
    displayName: Trivy Security Scan
    dependsOn: Build
    jobs:
      - job: ScanImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)
          - script: >
              sudo apt-get update

              sudo apt-get install -y wget apt-transport-https gnupg lsb-release


              wget https://aquasecurity.github.io/trivy-repo/deb/public.key

              sudo apt-key add public.key


              echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list


              sudo apt-get update

              sudo apt-get install -y trivy


              docker pull $(containerRegistry)/$(imageRepository):$(tag)


              trivy image $(containerRegistry)/$(imageRepository):$(tag)
            displayName: Scan Docker Image
  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn: SecurityScan
    jobs:
      - deployment: DeployDev
        displayName: Deploy to DEV
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmInstaller@1
                  displayName: Install Helm
                  inputs:
                    helmVersionToInstall: latest
                - task: AzureCLI@2
                  displayName: Login to AKS
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing
                - script: >
                    ls -la

                    helm upgrade --install aks-devops-app ./helm-chart \
                      --namespace dev \
                      --create-namespace \
                      --set image.repository=$(containerRegistry)/$(imageRepository) \
                      --set image.tag=$(tag)
                  displayName: Deploy Helm Chart
  - stage: DeployProd
    displayName: Deploy to PROD
    dependsOn: DeployDev
    jobs:
      - deployment: DeployProd
        displayName: Deploy to PROD
        environment: prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmInstaller@1
                  displayName: Install Helm
                  inputs:
                    helmVersionToInstall: latest
                - task: AzureCLI@2
                  displayName: Login to AKS
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing
                - script: >
                    helm upgrade --install aks-devops-app ./helm-chart \
                      --namespace prod \
                      --create-namespace \
                      --set image.repository=$(containerRegistry)/$(imageRepository) \
                      --set image.tag=$(tag)
                  displayName: Deploy Helm Chart
